name: Python wheel build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }} / CPython 3.10-3.14
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            macos_target: ""
          - name: Windows x86-64
            runner: windows-2022
            macos_target: ""
          - name: macOS Apple Silicon
            runner: macos-15
            macos_target: "15.0"
          - name: macOS Intel
            runner: macos-15-intel
            macos_target: "14.0"

    steps:
      - uses: actions/checkout@v6

      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install libomp
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install wheel builder
        run: python -m pip install "cibuildwheel==4.1.0" "delvewheel==1.10.0"

      - name: Build, repair, and test wheels
        working-directory: python_code/python
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CMAKE_ARGS: "-DRCP_NATIVE_OPTIMIZATION=OFF"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

      - name: Install CPython 3.12 wheel for platform tests
        working-directory: python_code/python
        run: |
          python -m pip install "matplotlib>=3.10" "numpy>=1.23" "pandas>=1.5" "scipy>=1.9"
          python -m pip install --no-index --find-links wheelhouse --no-deps "rcpgenerator==1.2.0"

      - name: Run installed-wheel platform tests outside source tree
        working-directory: ${{ runner.temp }}
        env:
          OMP_NUM_THREADS: "1"
          MPLBACKEND: "Agg"
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          python "${{ github.workspace }}/python_code/python/tests/test_permute_quench.py" --quick
          python "${{ github.workspace }}/python_code/python/tests/test_examples.py" --quick
          python "${{ github.workspace }}/python_code/python/tests/test_readme_snippets.py"
          python "${{ github.workspace }}/python_code/python/tests/test_ndim.py"

      - name: Retain built wheels
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rcpgenerator-${{ matrix.name }}
          path: python_code/python/wheelhouse/*.whl
          if-no-files-found: error
