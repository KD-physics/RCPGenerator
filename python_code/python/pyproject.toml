[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "rcpgenerator"
version = "1.0.0"
description = "Fast random close packing generator for polydisperse spheres in N dimensions (OpenMP + SIMD C++ core with a Python API)"
readme = "README.md"
authors = [
    { name = "Kenneth Desmond" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "random close packing",
    "sphere packing",
    "particle packing",
    "computational physics",
    "granular materials",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["matplotlib>=3.10", "numpy>=1.23", "pandas>=1.5", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/KD-physics/RCPGenerator"
Repository = "https://github.com/KD-physics/RCPGenerator"
Documentation = "https://github.com/KD-physics/RCPGenerator/blob/main/python_code/python/README.md"
"Getting Started" = "https://github.com/KD-physics/RCPGenerator/blob/main/getting_started.ipynb"
Examples = "https://github.com/KD-physics/RCPGenerator/tree/main/python_code/python/examples"
Issues = "https://github.com/KD-physics/RCPGenerator/issues"
Viewer = "https://kd-physics.github.io/RCPGenerator/webapp/index.html"

[tool.scikit-build]
cmake.source-dir = "."
build.verbose = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-command = "python {project}/tests/wheel_smoke.py"
test-requires = ["numpy"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
repair-wheel-command = "python -m delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["native"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
